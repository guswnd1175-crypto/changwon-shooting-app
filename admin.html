<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>관리자 - 창원 장애인 사격 세계 선수권 대회</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <!-- 로그인 화면 -->
  <div id="loginScreen">
    <div class="header">
      <img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
      <div class="title" data-i18n="adminTitle">관리자 모드</div>
      <button class="lang-btn" id="langBtnLogin" data-i18n="langBtn">ENG</button>
    </div>
    <div class="login-wrap">
      <input type="password" id="pwInput" data-i18n-placeholder="pwPlaceholder" placeholder="관리자 비밀번호">
      <button class="btn" id="loginBtn" data-i18n="loginBtn">로그인</button>
      <div class="error-text" id="loginError"></div>
      <a href="index.html" class="btn outline" data-i18n="backToMain" style="text-decoration:none;">← 참가자 화면으로</a>
    </div>
  </div>

  <!-- 편집 화면 (로그인 후) -->
  <div id="editScreen" style="display:none;">
    <div class="header">
      <img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
      <div class="title" data-i18n="adminTitle">관리자 모드</div>
      <button class="lang-btn" id="langBtnEdit" data-i18n="langBtn">ENG</button>
    </div>
    <div class="top-admin-bar">
      <button class="btn small outline" id="logoutBtn" data-i18n="logoutBtn">로그아웃</button>
    </div>

    <div class="dir-tabs" id="dirTabs"></div>

    <div class="section-title" data-i18n="editTableTitle">시간표 수정</div>
    <div id="rowsEditor"></div>
    <div class="save-bar">
      <button class="btn outline small" id="addRowBtn" data-i18n="addRow">+ 날짜(행) 추가</button>
      <button class="btn" id="saveTableBtn" data-i18n="saveBtn">저장 (실시간 반영)</button>
      <div class="save-msg" id="tableSaveMsg"></div>
    </div>

    <div class="section-title" data-i18n="editNoticeTitle">공지사항 수정</div>
    <div class="admin-row-card notice-edit">
      <label data-i18n="noticeInputLabel">공지사항 내용 (한글, 영문은 자동 번역됨)</label>
      <textarea id="noticeKo"></textarea>
    </div>
    <div class="save-bar">
      <button class="btn" id="saveNoticeBtn" data-i18n="saveBtn">저장 (실시간 반영)</button>
      <div class="save-msg" id="noticeSaveMsg"></div>
    </div>

    <div class="section-title" data-i18n="editBoardTitle">게시판 관리</div>
    <div id="boardEditor"></div>
    <div class="save-bar">
      <button class="btn outline small" id="addPostBtn" data-i18n="addPost">+ 게시글 추가</button>
      <button class="btn" id="saveBoardBtn" data-i18n="saveBtn">저장 (실시간 반영)</button>
      <div class="save-msg" id="boardSaveMsg"></div>
    </div>

    <div class="section-title">초기 데이터</div>
    <div class="save-bar">
      <button class="btn danger small" id="loadSeedBtn" data-i18n="loadSeedBtn">샘플 시간표 불러오기 (최초 1회, 기존 데이터 덮어씀)</button>
      <div class="save-msg" id="seedMsg"></div>
    </div>

    <div class="spacer"></div>
    <div class="admin-entry"><a href="index.html" data-i18n="backToMain">← 참가자 화면으로</a></div>
  </div>

</div>

<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="seed-data.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(window.FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let lang = localStorage.getItem("lang") || "ko";
  let currentDirection = "toRange";
  const workingData = { toRange: null, toCity: null };
  const editRowIdx = { toRange: 0, toCity: 0 };

  function setLang(l) {
    lang = l;
    localStorage.setItem("lang", lang);
    window.applyStaticI18n(lang);
    document.documentElement.lang = lang;
  }
  document.getElementById("langBtnLogin").addEventListener("click", function () { setLang(lang === "ko" ? "en" : "ko"); });
  document.getElementById("langBtnEdit").addEventListener("click", function () {
    setLang(lang === "ko" ? "en" : "ko");
    renderRowsEditor();
    renderBoardEditor();
  });

  // ---------- 로그인 ----------
  document.getElementById("loginBtn").addEventListener("click", function () {
    const pw = document.getElementById("pwInput").value;
    document.getElementById("loginError").textContent = "";
    signInWithEmailAndPassword(auth, window.ADMIN_EMAIL, pw).catch(function () {
      document.getElementById("loginError").textContent = window.I18N[lang].loginFail;
    });
  });
  document.getElementById("pwInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });
  document.getElementById("logoutBtn").addEventListener("click", function () { signOut(auth); });

  onAuthStateChanged(auth, function (user) {
    document.getElementById("loginScreen").style.display = user ? "none" : "block";
    document.getElementById("editScreen").style.display = user ? "block" : "none";
    if (user) init();
  });

  // ---------- 방향 탭 ----------
  function renderDirTabs() {
    const el = document.getElementById("dirTabs");
    el.innerHTML = "";
    window.DIRECTIONS.forEach(function (d) {
      const tab = document.createElement("div");
      tab.className = "dir-tab" + (d.key === currentDirection ? " active" : "");
      tab.textContent = d.label;
      tab.addEventListener("click", async function () {
        currentDirection = d.key;
        await loadDirection(currentDirection);
        renderDirTabs();
        renderRowsEditor();
      });
      el.appendChild(tab);
    });
  }

  async function loadDirection(direction) {
    if (workingData[direction]) return;
    const snap = await getDoc(doc(db, "schedules", direction));
    workingData[direction] = window.normalizeTable(snap.exists() ? snap.data() : { rows: [] });
  }

  // ---------- 행 에디터 ----------
  function blockCard(block, onRemove) {
    const card = document.createElement("div");
    card.className = "block-card";

    const titleInput = document.createElement("input");
    titleInput.type = "text";
    titleInput.className = "field-text";
    titleInput.placeholder = window.I18N[lang].title;
    titleInput.value = block.title || "";
    titleInput.addEventListener("input", function () { block.title = this.value; });
    card.appendChild(titleInput);

    const timeInput = document.createElement("input");
    timeInput.type = "text";
    timeInput.className = "field-text field-time";
    timeInput.placeholder = window.I18N[lang].time;
    timeInput.value = block.time || "";
    timeInput.addEventListener("input", function () { block.time = this.value; });
    card.appendChild(timeInput);

    const toneSelect = document.createElement("select");
    toneSelect.className = "field-tone";
    toneSelect.title = window.I18N[lang].tone;
    [["normal", window.I18N[lang].toneNormal], ["red", window.I18N[lang].toneRed], ["blue", window.I18N[lang].toneBlue]].forEach(function (opt) {
      const o = document.createElement("option");
      o.value = opt[0]; o.textContent = opt[1];
      if ((block.tone || "normal") === opt[0]) o.selected = true;
      toneSelect.appendChild(o);
    });
    toneSelect.addEventListener("change", function () { block.tone = this.value; });
    card.appendChild(toneSelect);

    const removeBtn = document.createElement("button");
    removeBtn.className = "remove-block-btn";
    removeBtn.textContent = "\u2715";
    removeBtn.title = window.I18N[lang].removeBlock;
    removeBtn.addEventListener("click", onRemove);
    card.appendChild(removeBtn);

    return card;
  }

  function renderRowsEditor() {
    const container = document.getElementById("rowsEditor");
    container.innerHTML = "";
    const table = workingData[currentDirection];
    if (!table) return;
    table.rows = table.rows || [];
    if (table.rows.length === 0) return;

    if (editRowIdx[currentDirection] >= table.rows.length) editRowIdx[currentDirection] = table.rows.length - 1;
    if (editRowIdx[currentDirection] < 0) editRowIdx[currentDirection] = 0;

    // 날짜별 탭
    const tabsEl = document.createElement("div");
    tabsEl.className = "date-tabs";
    table.rows.forEach(function (row, idx) {
      const tab = document.createElement("div");
      tab.className = "date-tab" + (idx === editRowIdx[currentDirection] ? " active" : "");
      tab.textContent = window.formatDateWithWeekday(row.date, lang) || row.date || "?";
      tab.addEventListener("click", function () {
        editRowIdx[currentDirection] = idx;
        renderRowsEditor();
      });
      tabsEl.appendChild(tab);
    });
    container.appendChild(tabsEl);

    // 선택된 날짜의 편집 카드
    const rowIdx = editRowIdx[currentDirection];
    const row = table.rows[rowIdx];
    const card = document.createElement("div");
    card.className = "admin-row-card";

    const head = document.createElement("div");
    head.className = "row-head";
    const dateLabel = document.createElement("label");
    dateLabel.textContent = window.I18N[lang].dateLabel;
    dateLabel.style.marginRight = "4px";
    const dateInput = document.createElement("input");
    dateInput.type = "text";
    dateInput.value = row.date || "";
    dateInput.addEventListener("input", function () {
      row.date = this.value;
      tabsEl.children[rowIdx].textContent = window.formatDateWithWeekday(row.date, lang) || row.date || "?";
    });
    head.appendChild(dateLabel);
    head.appendChild(dateInput);
    card.appendChild(head);

    (row.blocks || []).forEach(function (block, blockIdx) {
      card.appendChild(blockCard(block, function () {
        row.blocks.splice(blockIdx, 1);
        renderRowsEditor();
      }));
    });

    const rowActions = document.createElement("div");
    rowActions.className = "row-actions";
    const addBlockBtn = document.createElement("button");
    addBlockBtn.className = "btn outline small";
    addBlockBtn.textContent = window.I18N[lang].addBlock;
    addBlockBtn.addEventListener("click", function () {
      row.blocks = row.blocks || [];
      row.blocks.push({ title: "", time: "", tone: "normal" });
      renderRowsEditor();
    });
    const removeRowBtn = document.createElement("button");
    removeRowBtn.className = "link-btn";
    removeRowBtn.textContent = window.I18N[lang].removeRow;
    removeRowBtn.addEventListener("click", function () {
      table.rows.splice(rowIdx, 1);
      renderRowsEditor();
    });
    rowActions.appendChild(addBlockBtn);
    rowActions.appendChild(removeRowBtn);
    card.appendChild(rowActions);

    container.appendChild(card);
  }

  document.getElementById("addRowBtn").addEventListener("click", function () {
    const table = workingData[currentDirection];
    if (!table) return;
    table.rows = table.rows || [];
    table.rows.push({ date: "", blocks: [] });
    editRowIdx[currentDirection] = table.rows.length - 1;
    renderRowsEditor();
  });

  document.getElementById("saveTableBtn").addEventListener("click", async function () {
    const msg = document.getElementById("tableSaveMsg");
    try {
      await setDoc(doc(db, "schedules", currentDirection), workingData[currentDirection]);
      msg.textContent = window.I18N[lang].saved;
      msg.className = "save-msg ok";
    } catch (e) {
      msg.textContent = window.I18N[lang].saveFail;
      msg.className = "save-msg err";
    }
  });

  // ---------- 공지사항 ----------
  async function loadNotice() {
    const snap = await getDoc(doc(db, "meta", "notice"));
    const data = snap.exists() ? snap.data() : { ko: "" };
    document.getElementById("noticeKo").value = data.ko || "";
  }
  document.getElementById("saveNoticeBtn").addEventListener("click", async function () {
    const msg = document.getElementById("noticeSaveMsg");
    try {
      await setDoc(doc(db, "meta", "notice"), {
        ko: document.getElementById("noticeKo").value
      });
      msg.textContent = window.I18N[lang].saved;
      msg.className = "save-msg ok";
    } catch (e) {
      msg.textContent = window.I18N[lang].saveFail;
      msg.className = "save-msg err";
    }
  });

  // ---------- 게시판 ----------
  let boardPosts = [];
  function renderBoardEditor() {
    const container = document.getElementById("boardEditor");
    container.innerHTML = "";
    boardPosts.forEach(function (post, idx) {
      const card = document.createElement("div");
      card.className = "board-post-card";

      const titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.className = "field-text";
      titleInput.placeholder = window.I18N[lang].postTitleLabel;
      titleInput.value = post.title || "";
      titleInput.addEventListener("input", function () { post.title = this.value; });
      card.appendChild(titleInput);

      const contentArea = document.createElement("textarea");
      contentArea.className = "field-textarea";
      contentArea.placeholder = window.I18N[lang].postContentLabel;
      contentArea.value = post.content || "";
      contentArea.addEventListener("input", function () { post.content = this.value; });
      card.appendChild(contentArea);

      const removeBtn = document.createElement("button");
      removeBtn.className = "link-btn";
      removeBtn.textContent = window.I18N[lang].removePost;
      removeBtn.addEventListener("click", function () {
        boardPosts.splice(idx, 1);
        renderBoardEditor();
      });
      card.appendChild(removeBtn);

      container.appendChild(card);
    });
  }
  document.getElementById("addPostBtn").addEventListener("click", function () {
    boardPosts.push({ title: "", content: "" });
    renderBoardEditor();
  });
  async function loadBoard() {
    const snap = await getDoc(doc(db, "meta", "board"));
    boardPosts = (snap.exists() && snap.data().posts) ? snap.data().posts : [];
    renderBoardEditor();
  }
  document.getElementById("saveBoardBtn").addEventListener("click", async function () {
    const msg = document.getElementById("boardSaveMsg");
    try {
      await setDoc(doc(db, "meta", "board"), { posts: boardPosts });
      msg.textContent = window.I18N[lang].saved;
      msg.className = "save-msg ok";
    } catch (e) {
      msg.textContent = window.I18N[lang].saveFail;
      msg.className = "save-msg err";
    }
  });

  // ---------- 샘플 데이터 불러오기 ----------
  document.getElementById("loadSeedBtn").addEventListener("click", async function () {
    if (!confirm(window.I18N[lang].loadSeedConfirm)) return;
    const msg = document.getElementById("seedMsg");
    try {
      await setDoc(doc(db, "schedules", "toRange"), window.SEED_DATA.toRange);
      await setDoc(doc(db, "schedules", "toCity"), window.SEED_DATA.toCity);
      workingData.toRange = JSON.parse(JSON.stringify(window.SEED_DATA.toRange));
      workingData.toCity = JSON.parse(JSON.stringify(window.SEED_DATA.toCity));
      renderRowsEditor();
      msg.textContent = window.I18N[lang].saved;
      msg.className = "save-msg ok";
    } catch (e) {
      msg.textContent = window.I18N[lang].saveFail;
      msg.className = "save-msg err";
    }
  });

  // ---------- 초기화 ----------
  async function init() {
    setLang(lang);
    await loadDirection(currentDirection);
    renderDirTabs();
    renderRowsEditor();
    await loadNotice();
    await loadBoard();
  }
</script>
</body>
</html>
