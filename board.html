<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>창원 장애인 사격 세계 선수권 대회</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
    <div class="title app-title" data-i18n="pageTitle">창원 장애인 사격 세계 선수권 대회</div>
    <button class="lang-btn" id="langBtn" data-i18n="langBtn">ENG</button>
  </div>

  <div class="sub-menu" id="subMenu"></div>

  <div class="table-wrap" id="boardWrap">
    <div class="table-empty" data-i18n="loading">불러오는 중...</div>
  </div>

  <div class="spacer"></div>
  <div class="admin-entry"><a href="admin.html" data-i18n="adminEntry">관리자 로그인</a></div>
</div>

<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(window.FIREBASE_CONFIG);
  const db = getFirestore(app);

  let lang = localStorage.getItem("lang") || "ko";
  let latestPosts = [];

  async function renderBoard() {
    const wrap = document.getElementById("boardWrap");
    let posts = latestPosts;
    if (lang === "en" && posts.length) {
      posts = await Promise.all(posts.map(async function (p) {
        return {
          title: p.title ? await window.translateText(p.title) : "",
          content: p.content ? await window.translateText(p.content) : ""
        };
      }));
    }
    window.renderBoardList(wrap, posts, lang);
  }

  document.getElementById("langBtn").addEventListener("click", function () {
    lang = lang === "ko" ? "en" : "ko";
    localStorage.setItem("lang", lang);
    window.applyStaticI18n(lang);
    document.documentElement.lang = lang;
    window.renderSubMenu(document.getElementById("subMenu"), "board", lang);
    renderBoard();
  });

  window.renderSubMenu(document.getElementById("subMenu"), "board", lang);

  onSnapshot(doc(db, "meta", "board"), function (snap) {
    latestPosts = (snap.exists() && snap.data().posts) ? snap.data().posts : [];
    renderBoard();
  });

  window.applyStaticI18n(lang);
  document.documentElement.lang = lang;
</script>
</body>
</html>
