<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>창원 장애인 사격 세계 선수권 대회</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <a href="index.html"><img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'"></a>
    <div class="title app-title" data-i18n="pageTitle">창원 장애인 사격 세계 선수권 대회</div>
    <button class="lang-btn" id="langBtn" data-i18n="langBtn">ENG</button>
  </div>

  <div class="sub-menu" id="subMenu"></div>

  <div class="notice" id="notice">
    <div class="notice-title" data-i18n="noticeSectionTitle">공지사항</div>
    <div id="noticeText"></div>
  </div>

  <div class="spacer"></div>
  <div class="admin-entry"><a href="admin.html" data-i18n="adminEntry">관리자 로그인</a></div>
</div>

<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(window.FIREBASE_CONFIG);
  const db = getFirestore(app);

  let lang = localStorage.getItem("lang") || "ko";
  let latestNotice = null;

  async function renderNotice(noticeData) {
    const koText = noticeData ? (noticeData.ko || "") : "";
    let text = koText;
    if (lang === "en" && koText) {
      text = await window.translateText(koText);
    }
    document.getElementById("noticeText").textContent = text;
  }

  document.getElementById("langBtn").addEventListener("click", function () {
    lang = lang === "ko" ? "en" : "ko";
    localStorage.setItem("lang", lang);
    window.applyStaticI18n(lang);
    document.documentElement.lang = lang;
    window.renderSubMenu(document.getElementById("subMenu"), "notice", lang);
    renderNotice(latestNotice);
  });

  window.renderSubMenu(document.getElementById("subMenu"), "notice", lang);

  onSnapshot(doc(db, "meta", "notice"), function (snap) {
    latestNotice = snap.exists() ? snap.data() : null;
    renderNotice(latestNotice);
  });

  window.applyStaticI18n(lang);
  document.documentElement.lang = lang;
</script>
</body>
</html>
