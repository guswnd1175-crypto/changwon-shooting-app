<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>창원 장애인 사격 세계 선수권 대회</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <a href="index.html"><img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'"></a>
    <div class="title app-title" data-i18n="pageTitle">창원 장애인 사격 세계 선수권 대회</div>
    <button class="lang-btn" id="langBtn" data-i18n="langBtn">ENG</button>
  </div>

  <div class="sub-menu" id="subMenu"></div>

  <!-- 목록 화면 -->
  <div id="boardListView">
    <div class="board-type-tabs" id="boardTypeTabs"></div>
    <div class="board-toolbar">
      <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="검색어를 입력하세요">
      <button class="btn small" id="writeBtn" data-i18n="writePostBtn">+ 글쓰기</button>
    </div>
    <div id="postListWrap"></div>
  </div>

  <!-- 글쓰기 화면 -->
  <div id="boardWriteView" class="post-form" style="display:none;">
    <div class="section-title" id="writeFormTitle">새 글 작성</div>
    <label data-i18n="postTitleLabel">제목</label>
    <input type="text" id="postTitleInput" data-i18n-placeholder="postTitlePlaceholder" placeholder="제목을 입력하세요">

    <label data-i18n="postContentLabel">내용</label>
    <textarea id="postContentInput" data-i18n-placeholder="postContentPlaceholder" placeholder="내용을 입력하세요"></textarea>

    <div class="checkbox-row">
      <input type="checkbox" id="postAnonymous">
      <label for="postAnonymous" data-i18n="anonymousLabel" style="margin:0;">익명</label>
    </div>
    <div class="author-fields" id="authorFields">
      <input type="text" id="postNameInput" data-i18n-placeholder="postNamePlaceholder" placeholder="이름">
      <input type="text" id="postCountryInput" data-i18n-placeholder="postCountryPlaceholder" placeholder="국가">
    </div>

    <label data-i18n="postPasswordLabel" style="display:none;"></label>
    <input type="password" id="postPasswordInput" data-i18n-placeholder="postPasswordPlaceholder" placeholder="비밀번호 (삭제/열람 시 필요)">

    <label data-i18n="attachImageLabel">사진 첨부 (선택)</label>
    <input type="file" id="postImageInput" accept="image/*">
    <img id="postImagePreview" class="image-preview">
    <button class="link-btn" id="removeImageBtn" data-i18n="removeImageBtn" style="display:none;">사진 제거</button>

    <div class="save-bar">
      <button class="btn outline small" id="cancelWriteBtn" data-i18n="cancelBtn">취소</button>
      <button class="btn" id="submitPostBtn" data-i18n="submitPostBtn">등록</button>
      <div class="save-msg" id="writeMsg"></div>
    </div>
  </div>

  <!-- 상세 화면 -->
  <div id="boardDetailView" class="post-detail" style="display:none;"></div>

  <div class="spacer"></div>
  <div class="admin-entry"><a href="admin.html" data-i18n="adminEntry">관리자 로그인</a></div>
</div>

<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot,
    addDoc, updateDoc, deleteDoc, doc, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(window.FIREBASE_CONFIG);
  const db = getFirestore(app);

  let lang = localStorage.getItem("lang") || "ko";
  let currentBoard = "free";
  let searchQuery = "";
  let allPosts = [];
  const unlockedPosts = new Set();
  let selectedImageDataUrl = null;
  let commentUnsub = null;
  let editingPostId = null;

  function dict() { return window.I18N[lang]; }

  function setView(name) {
    document.getElementById("boardListView").style.display = name === "list" ? "block" : "none";
    document.getElementById("boardWriteView").style.display = name === "write" ? "block" : "none";
    document.getElementById("boardDetailView").style.display = name === "detail" ? "block" : "none";
    if (name !== "detail" && commentUnsub) { commentUnsub(); commentUnsub = null; }
  }

  // ---------- 소메뉴 / 게시판 탭 ----------
  function renderBoardTypeTabs() {
    const el = document.getElementById("boardTypeTabs");
    el.innerHTML = "";
    window.BOARD_TYPES.forEach(function (b) {
      const tab = document.createElement("div");
      tab.className = "board-type-tab" + (b.key === currentBoard ? " active" : "");
      tab.textContent = dict()[b.i18nKey];
      tab.addEventListener("click", function () {
        currentBoard = b.key;
        renderBoardTypeTabs();
        renderList();
      });
      el.appendChild(tab);
    });
  }

  // ---------- 목록 ----------
  function renderList() {
    const wrap = document.getElementById("postListWrap");
    wrap.innerHTML = "";
    let posts = allPosts.filter(function (p) { return p.board === currentBoard; });
    if (searchQuery) {
      posts = posts.filter(function (p) {
        const hay = ((p.title || "") + " " + (p.content || "") + " " + (p.name || "")).toLowerCase();
        return hay.indexOf(searchQuery) !== -1;
      });
    }
    if (posts.length === 0) {
      const empty = document.createElement("div");
      empty.className = "board-empty";
      empty.textContent = searchQuery ? dict().searchNoResult : dict().boardEmpty;
      wrap.appendChild(empty);
      return;
    }
    posts.forEach(function (post) {
      const card = document.createElement("div");
      card.className = "post-card";
      const title = document.createElement("div");
      title.className = "post-card-title";
      title.textContent = (post.board === "cs" ? dict().secretLockLabel + " " : "") + (post.title || "");
      const meta = document.createElement("div");
      meta.className = "post-card-meta";
      const author = document.createElement("span");
      author.textContent = window.formatAuthor(post, lang);
      const date = document.createElement("span");
      date.textContent = window.formatPostDate(post.createdAt);
      meta.appendChild(author);
      meta.appendChild(date);
      card.appendChild(title);
      card.appendChild(meta);
      if (post.board === "free" && post.imageData) {
        const thumb = document.createElement("img");
        thumb.className = "post-thumb";
        thumb.src = post.imageData;
        card.appendChild(thumb);
      }
      card.addEventListener("click", function () { openDetail(post); });
      wrap.appendChild(card);
    });
  }

  // ---------- 상세보기 ----------
  async function openDetail(post) {
    if (post.board === "cs" && !unlockedPosts.has(post.id)) {
      const pw = prompt(dict().secretPostLabel);
      if (pw === null) return;
      const hash = await window.sha256Hex(pw);
      if (hash !== post.passwordHash) { alert(dict().wrongPassword); return; }
      unlockedPosts.add(post.id);
    }
    renderDetail(post);
    setView("detail");
  }

  function renderDetail(post) {
    const el = document.getElementById("boardDetailView");
    el.innerHTML = "";

    const backBtn = document.createElement("button");
    backBtn.className = "link-btn";
    backBtn.textContent = dict().backToListBtn;
    backBtn.addEventListener("click", function () { setView("list"); });
    el.appendChild(backBtn);

    const title = document.createElement("div");
    title.className = "post-detail-title";
    title.textContent = post.title || "";
    el.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "post-detail-meta";
    meta.textContent = window.formatAuthor(post, lang) + " · " + window.formatPostDate(post.createdAt);
    el.appendChild(meta);

    if (post.imageData) {
      const img = document.createElement("img");
      img.className = "post-detail-image";
      img.src = post.imageData;
      el.appendChild(img);
    }

    const content = document.createElement("div");
    content.className = "post-detail-content";
    content.textContent = post.content || "";
    el.appendChild(content);

    if (post.board === "cs") {
      const replyBox = document.createElement("div");
      replyBox.className = "admin-reply-box";
      const replyTitle = document.createElement("div");
      replyTitle.className = "reply-title";
      replyTitle.textContent = dict().adminReplyTitle;
      const replyContent = document.createElement("div");
      replyContent.className = "reply-content";
      replyContent.textContent = (post.adminReply && post.adminReply.content) ? post.adminReply.content : dict().noReplyYet;
      replyBox.appendChild(replyTitle);
      replyBox.appendChild(replyContent);
      el.appendChild(replyBox);
    }

    const actions = document.createElement("div");
    actions.className = "post-detail-actions";

    const editBtn = document.createElement("button");
    editBtn.className = "btn outline small";
    editBtn.textContent = dict().editPostBtn;
    editBtn.addEventListener("click", async function () {
      const pw = prompt(dict().editPasswordPrompt);
      if (pw === null) return;
      const hash = await window.sha256Hex(pw);
      if (hash !== post.passwordHash) { alert(dict().wrongPassword); return; }
      openEditForm(post);
    });
    actions.appendChild(editBtn);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "btn outline small";
    deleteBtn.textContent = dict().deletePostBtn;
    deleteBtn.addEventListener("click", async function () {
      const pw = prompt(dict().deletePasswordPrompt);
      if (pw === null) return;
      const hash = await window.sha256Hex(pw);
      if (hash !== post.passwordHash) { alert(dict().wrongPassword); return; }
      await deleteDoc(doc(db, "posts", post.id));
      try {
        const commentsSnap = await getDocs(collection(db, "posts", post.id, "comments"));
        for (const c of commentsSnap.docs) await deleteDoc(c.ref);
      } catch (e) {}
      setView("list");
    });
    actions.appendChild(deleteBtn);

    el.appendChild(actions);

    if (post.board === "free") {
      el.appendChild(buildCommentsSection(post));
    }
  }

  function buildCommentsSection(post) {
    const section = document.createElement("div");
    section.className = "comments-section";
    const title = document.createElement("div");
    title.className = "comments-title";
    title.textContent = dict().commentsTitle;
    section.appendChild(title);

    const listEl = document.createElement("div");
    listEl.id = "commentListWrap";
    section.appendChild(listEl);

    const form = document.createElement("div");
    form.className = "post-form";
    form.style.marginTop = "10px";

    const checkboxRow = document.createElement("div");
    checkboxRow.className = "checkbox-row";
    const anonCheck = document.createElement("input");
    anonCheck.type = "checkbox";
    anonCheck.id = "commentAnonymous";
    const anonLabel = document.createElement("label");
    anonLabel.textContent = dict().anonymousLabel;
    anonLabel.style.margin = "0";
    anonLabel.setAttribute("for", "commentAnonymous");
    checkboxRow.appendChild(anonCheck);
    checkboxRow.appendChild(anonLabel);
    form.appendChild(checkboxRow);

    const authorFields = document.createElement("div");
    authorFields.className = "author-fields";
    authorFields.style.marginTop = "8px";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = dict().postNamePlaceholder;
    const countryInput = document.createElement("input");
    countryInput.type = "text";
    countryInput.placeholder = dict().postCountryPlaceholder;
    authorFields.appendChild(nameInput);
    authorFields.appendChild(countryInput);
    form.appendChild(authorFields);
    anonCheck.addEventListener("change", function () {
      authorFields.style.display = anonCheck.checked ? "none" : "flex";
    });

    const contentInput = document.createElement("textarea");
    contentInput.placeholder = dict().commentPlaceholder;
    contentInput.style.minHeight = "60px";
    contentInput.style.marginTop = "8px";
    form.appendChild(contentInput);

    const submitBtn = document.createElement("button");
    submitBtn.className = "btn small";
    submitBtn.style.marginTop = "8px";
    submitBtn.textContent = dict().addCommentBtn;
    submitBtn.addEventListener("click", async function () {
      const text = contentInput.value.trim();
      if (!text) return;
      await addDoc(collection(db, "posts", post.id, "comments"), {
        name: anonCheck.checked ? "" : nameInput.value.trim(),
        country: anonCheck.checked ? "" : countryInput.value.trim(),
        anonymous: anonCheck.checked,
        content: text,
        createdAt: serverTimestamp()
      });
      contentInput.value = "";
    });
    form.appendChild(submitBtn);
    section.appendChild(form);

    if (commentUnsub) commentUnsub();
    commentUnsub = onSnapshot(query(collection(db, "posts", post.id, "comments"), orderBy("createdAt", "asc")), function (snap) {
      listEl.innerHTML = "";
      if (snap.empty) {
        const empty = document.createElement("div");
        empty.className = "board-empty";
        empty.textContent = dict().noComments;
        listEl.appendChild(empty);
        return;
      }
      snap.forEach(function (docSnap) {
        const c = docSnap.data();
        const item = document.createElement("div");
        item.className = "comment-item";
        const meta = document.createElement("div");
        meta.className = "comment-meta";
        meta.textContent = window.formatAuthor(c, lang) + " · " + window.formatPostDate(c.createdAt);
        const body = document.createElement("div");
        body.textContent = c.content || "";
        item.appendChild(meta);
        item.appendChild(body);
        listEl.appendChild(item);
      });
    });

    return section;
  }

  // ---------- 글쓰기 ----------
  function resetWriteForm() {
    document.getElementById("postTitleInput").value = "";
    document.getElementById("postContentInput").value = "";
    document.getElementById("postAnonymous").checked = false;
    document.getElementById("authorFields").style.display = "flex";
    document.getElementById("postNameInput").value = "";
    document.getElementById("postCountryInput").value = "";
    document.getElementById("postPasswordInput").value = "";
    document.getElementById("postPasswordInput").placeholder = dict().postPasswordPlaceholder;
    document.getElementById("postImageInput").value = "";
    document.getElementById("postImagePreview").style.display = "none";
    document.getElementById("postImagePreview").src = "";
    document.getElementById("removeImageBtn").style.display = "none";
    document.getElementById("writeMsg").textContent = "";
    document.getElementById("writeFormTitle").textContent = dict().newPostTitle;
    selectedImageDataUrl = null;
  }

  function openEditForm(post) {
    editingPostId = post.id;
    currentBoard = post.board;
    document.getElementById("postTitleInput").value = post.title || "";
    document.getElementById("postContentInput").value = post.content || "";
    document.getElementById("postAnonymous").checked = !!post.anonymous;
    document.getElementById("authorFields").style.display = post.anonymous ? "none" : "flex";
    document.getElementById("postNameInput").value = post.name || "";
    document.getElementById("postCountryInput").value = post.country || "";
    document.getElementById("postPasswordInput").value = "";
    document.getElementById("postPasswordInput").placeholder = dict().postPasswordEditPlaceholder;
    document.getElementById("postImageInput").value = "";
    selectedImageDataUrl = post.imageData || null;
    const preview = document.getElementById("postImagePreview");
    if (selectedImageDataUrl) {
      preview.src = selectedImageDataUrl;
      preview.style.display = "block";
      document.getElementById("removeImageBtn").style.display = "inline-block";
    } else {
      preview.style.display = "none";
      preview.src = "";
      document.getElementById("removeImageBtn").style.display = "none";
    }
    document.getElementById("writeMsg").textContent = "";
    document.getElementById("writeFormTitle").textContent = dict().editPostTitle;
    setView("write");
  }

  document.getElementById("writeBtn").addEventListener("click", function () {
    editingPostId = null;
    resetWriteForm();
    setView("write");
  });
  document.getElementById("cancelWriteBtn").addEventListener("click", function () {
    editingPostId = null;
    setView("list");
  });

  document.getElementById("postAnonymous").addEventListener("change", function () {
    document.getElementById("authorFields").style.display = this.checked ? "none" : "flex";
  });

  document.getElementById("postImageInput").addEventListener("change", async function () {
    const file = this.files[0];
    if (!file) return;
    try {
      const dataUrl = await window.compressImageToDataUrl(file, 1000, 0.7);
      if (dataUrl.length > 900000) { alert(dict().imageTooLargeMsg); this.value = ""; return; }
      selectedImageDataUrl = dataUrl;
      const preview = document.getElementById("postImagePreview");
      preview.src = dataUrl;
      preview.style.display = "block";
      document.getElementById("removeImageBtn").style.display = "inline-block";
    } catch (e) {
      alert(dict().imageTooLargeMsg);
    }
  });
  document.getElementById("removeImageBtn").addEventListener("click", function () {
    selectedImageDataUrl = null;
    document.getElementById("postImageInput").value = "";
    document.getElementById("postImagePreview").style.display = "none";
    document.getElementById("removeImageBtn").style.display = "none";
  });

  document.getElementById("submitPostBtn").addEventListener("click", async function () {
    const title = document.getElementById("postTitleInput").value.trim();
    const content = document.getElementById("postContentInput").value.trim();
    const password = document.getElementById("postPasswordInput").value;
    const anonymous = document.getElementById("postAnonymous").checked;
    const name = anonymous ? "" : document.getElementById("postNameInput").value.trim();
    const country = anonymous ? "" : document.getElementById("postCountryInput").value.trim();
    const msg = document.getElementById("writeMsg");
    if (!title || !content || (!editingPostId && !password)) {
      msg.textContent = dict().requiredFieldsMsg;
      msg.className = "save-msg err";
      return;
    }
    try {
      if (editingPostId) {
        const updateData = {
          title: title,
          content: content,
          imageData: selectedImageDataUrl || null,
          anonymous: anonymous,
          name: name,
          country: country,
          updatedAt: serverTimestamp()
        };
        if (password) updateData.passwordHash = await window.sha256Hex(password);
        await updateDoc(doc(db, "posts", editingPostId), updateData);
        editingPostId = null;
      } else {
        const passwordHash = await window.sha256Hex(password);
        await addDoc(collection(db, "posts"), {
          board: currentBoard,
          title: title,
          content: content,
          imageData: selectedImageDataUrl || null,
          anonymous: anonymous,
          name: name,
          country: country,
          passwordHash: passwordHash,
          adminReply: null,
          createdAt: serverTimestamp()
        });
      }
      setView("list");
    } catch (e) {
      msg.textContent = dict().saveFail;
      msg.className = "save-msg err";
    }
  });

  // ---------- 검색 ----------
  document.getElementById("searchInput").addEventListener("input", function () {
    searchQuery = this.value.trim().toLowerCase();
    renderList();
  });

  // ---------- 언어 ----------
  document.getElementById("langBtn").addEventListener("click", function () {
    lang = lang === "ko" ? "en" : "ko";
    localStorage.setItem("lang", lang);
    window.applyStaticI18n(lang);
    document.documentElement.lang = lang;
    window.renderSubMenu(document.getElementById("subMenu"), "board", lang);
    renderBoardTypeTabs();
    renderList();
  });

  // ---------- 초기화 ----------
  window.renderSubMenu(document.getElementById("subMenu"), "board", lang);
  renderBoardTypeTabs();
  window.applyStaticI18n(lang);
  document.documentElement.lang = lang;

  onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), function (snap) {
    allPosts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    renderList();
  });
</script>
</body>
</html>
