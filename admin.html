<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>관리자 - 창원 장애인 사격 세계 선수권 대회</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <!-- 로그인 화면 -->
  <div id="loginScreen">
    <div class="header">
      <a href="index.html"><img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'"></a>
      <div class="title" data-i18n="adminTitle">관리자 모드</div>
      <button class="lang-btn" id="langBtnLogin" data-i18n="langBtn">ENG</button>
    </div>
    <div class="login-wrap">
      <input type="password" id="pwInput" data-i18n-placeholder="pwPlaceholder" placeholder="관리자 비밀번호">
      <button class="btn" id="loginBtn" data-i18n="loginBtn">로그인</button>
      <div class="error-text" id="loginError"></div>
      <a href="index.html" class="btn outline" data-i18n="backToMain" style="text-decoration:none;">← 참가자 화면으로</a>
    </div>
  </div>

  <!-- 편집 화면 (로그인 후) -->
  <div id="editScreen" style="display:none;">
    <div class="header">
      <a href="index.html"><img class="logo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'"></a>
      <div class="title" data-i18n="adminTitle">관리자 모드</div>
      <button class="lang-btn" id="langBtnEdit" data-i18n="langBtn">ENG</button>
    </div>
    <div class="top-admin-bar">
      <button class="btn small outline" id="logoutBtn" data-i18n="logoutBtn">로그아웃</button>
    </div>

    <div class="admin-section-tabs" id="adminSectionTabs"></div>

    <div id="scheduleSection">
      <div class="dir-tabs" id="dirTabs"></div>

      <div class="section-title" data-i18n="editTableTitle">시간표 수정</div>
      <div id="rowsEditor"></div>
      <div class="save-bar">
        <button class="btn outline small" id="addRowBtn" data-i18n="addRow">+ 날짜(행) 추가</button>
        <button class="btn" id="saveTableBtn" data-i18n="saveBtn">저장 (실시간 반영)</button>
        <div class="save-msg" id="tableSaveMsg"></div>
      </div>

      <div class="section-title">초기 데이터</div>
      <div class="save-bar">
        <button class="btn danger small" id="loadSeedBtn" data-i18n="loadSeedBtn">샘플 시간표 불러오기 (최초 1회, 기존 데이터 덮어씀)</button>
        <div class="save-msg" id="seedMsg"></div>
      </div>
    </div>

    <div id="noticeSection" style="display:none;">
      <div class="section-title" data-i18n="editNoticeTitle">공지사항 수정</div>
      <div class="admin-row-card notice-edit">
        <label data-i18n="noticeInputLabel">공지사항 내용 (한글, 영문은 자동 번역됨)</label>
        <textarea id="noticeKo"></textarea>
      </div>
      <div class="save-bar">
        <button class="btn" id="saveNoticeBtn" data-i18n="saveBtn">저장 (실시간 반영)</button>
        <div class="save-msg" id="noticeSaveMsg"></div>
      </div>
    </div>

    <div id="boardSection" style="display:none;">
      <div class="section-title" data-i18n="editBoardTitle">게시판 관리</div>
      <div class="board-type-tabs" id="adminBoardTypeTabs"></div>
      <div id="adminBoardListWrap"></div>
    </div>

    <div id="reservationSection" style="display:none;">
      <div class="section-title" data-i18n="editReservationTitle">예약 관리</div>
      <div id="adminReservationListWrap"></div>
    </div>

    <div class="spacer"></div>
    <div class="admin-entry"><a href="index.html" data-i18n="backToMain">← 참가자 화면으로</a></div>
  </div>

</div>

<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="seed-data.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc,
    collection, query, orderBy, onSnapshot, deleteDoc, updateDoc, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(window.FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let lang = localStorage.getItem("lang") || "ko";
  let currentDirection = "toRange";
  const workingData = { toRange: null, toCity: null };
  const editRowIdx = { toRange: 0, toCity: 0 };

  function setLang(l) {
    lang = l;
    localStorage.setItem("lang", lang);
    window.applyStaticI18n(lang);
    document.documentElement.lang = lang;
  }
  document.getElementById("langBtnLogin").addEventListener("click", function () { setLang(lang === "ko" ? "en" : "ko"); });
  document.getElementById("langBtnEdit").addEventListener("click", function () {
    setLang(lang === "ko" ? "en" : "ko");
    renderAdminSectionTabs();
    renderRowsEditor();
    renderAdminBoardTypeTabs();
    renderAdminBoardList();
    renderAdminReservationList();
  });

  // ---------- 관리자 화면 섹션 탭 ----------
  const ADMIN_SECTIONS = [
    { key: "schedule", i18nKey: "editTableTitle", el: "scheduleSection" },
    { key: "notice", i18nKey: "editNoticeTitle", el: "noticeSection" },
    { key: "board", i18nKey: "editBoardTitle", el: "boardSection" },
    { key: "reservation", i18nKey: "editReservationTitle", el: "reservationSection" }
  ];
  let currentAdminSection = "schedule";

  function renderAdminSectionTabs() {
    const el = document.getElementById("adminSectionTabs");
    el.innerHTML = "";
    ADMIN_SECTIONS.forEach(function (s) {
      const tab = document.createElement("div");
      tab.className = "admin-section-tab" + (s.key === currentAdminSection ? " active" : "");
      tab.textContent = window.I18N[lang][s.i18nKey];
      tab.addEventListener("click", function () {
        currentAdminSection = s.key;
        showAdminSection();
        renderAdminSectionTabs();
      });
      el.appendChild(tab);
    });
  }

  function showAdminSection() {
    ADMIN_SECTIONS.forEach(function (s) {
      document.getElementById(s.el).style.display = s.key === currentAdminSection ? "block" : "none";
    });
  }

  // ---------- 로그인 ----------
  document.getElementById("loginBtn").addEventListener("click", function () {
    const pw = document.getElementById("pwInput").value;
    document.getElementById("loginError").textContent = "";
    signInWithEmailAndPassword(auth, window.ADMIN_EMAIL, pw).catch(function () {
      document.getElementById("loginError").textContent = window.I18N[lang].loginFail;
    });
  });
  document.getElementById("pwInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });
  document.getElementById("logoutBtn").addEventListener("click", function () { signOut(auth); });

  onAuthStateChanged(auth, function (user) {
    document.getElementById("loginScreen").style.display = user ? "none" : "block";
    document.getElementById("editScreen").style.display = user ? "block" : "none";
    if (user) init();
  });

  // ---------- 방향 탭 ----------
  function renderDirTabs() {
    const el = document.getElementById("dirTabs");
    el.innerHTML = "";
    window.DIRECTIONS.forEach(function (d) {
      const tab = document.createElement("div");
      tab.className = "dir-tab" + (d.key === currentDirection ? " active" : "");
      tab.textContent = d.label;
      tab.addEventListener("click", async function () {
        currentDirection = d.key;
        await loadDirection(currentDirection);
        renderDirTabs();
        renderRowsEditor();
      });
      el.appendChild(tab);
    });
  }

  async function loadDirection(direction) {
    if (workingData[direction]) return;
    const snap = await getDoc(doc(db, "schedules", direction));
    workingData[direction] = window.normalizeTable(snap.exists() ? snap.data() : { rows: [] });
  }

  // ---------- 행 에디터 ----------
  function blockCard(block, onRemove) {
    const card = document.createElement("div");
    card.className = "block-card";

    const titleInput = document.createElement("input");
    titleInput.type = "text";
    titleInput.className = "field-text";
    titleInput.placeholder = window.I18N[lang].title;
    titleInput.value = block.title || "";
    titleInput.addEventListener("input", function () { block.title = this.value; });
    card.appendChild(titleInput);

    const timeInput = document.createElement("input");
    timeInput.type = "text";
    timeInput.className = "field-text field-time";
    timeInput.placeholder = window.I18N[lang].time;
    timeInput.value = block.time || "";
    timeInput.addEventListener("input", function () { block.time = this.value; });
    card.appendChild(timeInput);

    const toneSelect = document.createElement("select");
    toneSelect.className = "field-tone";
    toneSelect.title = window.I18N[lang].tone;
    [["normal", window.I18N[lang].toneNormal], ["red", window.I18N[lang].toneRed], ["blue", window.I18N[lang].toneBlue]].forEach(function (opt) {
      const o = document.createElement("option");
      o.value = opt[0]; o.textContent = opt[1];
      if ((block.tone || "normal") === opt[0]) o.selected = true;
      toneSelect.appendChild(o);
    });
    toneSelect.addEventListener("change", function () { block.tone = this.value; });
    card.appendChild(toneSelect);

    const removeBtn = document.createElement("button");
    removeBtn.className = "remove-block-btn";
    removeBtn.textContent = "\u2715";
    removeBtn.title = window.I18N[lang].removeBlock;
    removeBtn.addEventListener("click", onRemove);
    card.appendChild(removeBtn);

    return card;
  }

  function renderRowsEditor() {
    const container = document.getElementById("rowsEditor");
    container.innerHTML = "";
    const table = workingData[currentDirection];
    if (!table) return;
    table.rows = table.rows || [];
    if (table.rows.length === 0) return;

    if (editRowIdx[currentDirection] >= table.rows.length) editRowIdx[currentDirection] = table.rows.length - 1;
    if (editRowIdx[currentDirection] < 0) editRowIdx[currentDirection] = 0;

    // 날짜별 탭
    const tabsEl = document.createElement("div");
    tabsEl.className = "date-tabs";
    table.rows.forEach(function (row, idx) {
      const tab = document.createElement("div");
      tab.className = "date-tab" + (idx === editRowIdx[currentDirection] ? " active" : "");
      tab.textContent = window.formatDateWithWeekday(row.date, lang) || row.date || "?";
      tab.addEventListener("click", function () {
        editRowIdx[currentDirection] = idx;
        renderRowsEditor();
      });
      tabsEl.appendChild(tab);
    });
    container.appendChild(tabsEl);

    // 선택된 날짜의 편집 카드
    const rowIdx = editRowIdx[currentDirection];
    const row = table.rows[rowIdx];
    const card = document.createElement("div");
    card.className = "admin-row-card";

    const head = document.createElement("div");
    head.className = "row-head";
    const dateLabel = document.createElement("label");
    dateLabel.textContent = window.I18N[lang].dateLabel;
    dateLabel.style.marginRight = "4px";
    const dateInput = document.createElement("input");
    dateInput.type = "text";
    dateInput.value = row.date || "";
    dateInput.addEventListener("input", function () {
      row.date = this.value;
      tabsEl.children[rowIdx].textContent = window.formatDateWithWeekday(row.date, lang) || row.date || "?";
    });
    head.appendChild(dateLabel);
    head.appendChild(dateInput);
    card.appendChild(head);

    (row.blocks || []).forEach(function (block, blockIdx) {
      card.appendChild(blockCard(block, function () {
        row.blocks.splice(blockIdx, 1);
        renderRowsEditor();
      }));
    });

    const rowActions = document.createElement("div");
    rowActions.className = "row-actions";
    const addBlockBtn = document.createElement("button");
    addBlockBtn.className = "btn outline small";
    addBlockBtn.textContent = window.I18N[lang].addBlock;
    addBlockBtn.addEventListener("click", function () {
      row.blocks = row.blocks || [];
      row.blocks.push({ title: "", time: "", tone: "normal" });
      renderRowsEditor();
    });
    const removeRowBtn = document.createElement("button");
    removeRowBtn.className = "link-btn";
    removeRowBtn.textContent = window.I18N[lang].removeRow;
    removeRowBtn.addEventListener("click", function () {
      table.rows.splice(rowIdx, 1);
      renderRowsEditor();
    });
    rowActions.appendChild(addBlockBtn);
    rowActions.appendChild(removeRowBtn);
    card.appendChild(rowActions);

    container.appendChild(card);
  }

  document.getElementById("addRowBtn").addEventListener("click", function () {
    const table = workingData[currentDirection];
    if (!table) return;
    table.rows = table.rows || [];
    table.rows.push({ date: "", blocks: [] });
    editRowIdx[currentDirection] = table.rows.length - 1;
    renderRowsEditor();
  });

  document.getElementById("saveTableBtn").addEventListener("click", async function () {
    const msg = document.getElementById("tableSaveMsg");
    try {
      await setDoc(doc(db, "schedules", currentDirection), workingData[currentDirection]);
      msg.textContent = window.I18N[lang].saved;
      msg.className = "save-msg ok";
    } catch (e) {
      msg.textContent = window.I18N[lang].saveFail;
      msg.className = "save-msg err";
    }
  });

  // ---------- 공지사항 ----------
  async function loadNotice() {
    const snap = await getDoc(doc(db, "meta", "notice"));
    const data = snap.exists() ? snap.data() : { ko: "" };
    document.getElementById("noticeKo").value = data.ko || "";
  }
  document.getElementById("saveNoticeBtn").addEventListener("click", async function () {
    const msg = document.getElementById("noticeSaveMsg");
    try {
      await setDoc(doc(db, "meta", "notice"), {
        ko: document.getElementById("noticeKo").value
      });
      msg.textContent = window.I18N[lang].saved;
      msg.className = "save-msg ok";
    } catch (e) {
      msg.textContent = window.I18N[lang].saveFail;
      msg.className = "save-msg err";
    }
  });

  // ---------- 게시판 ----------
  let adminAllPosts = [];
  let currentAdminBoard = "free";

  function renderAdminBoardTypeTabs() {
    const el = document.getElementById("adminBoardTypeTabs");
    el.innerHTML = "";
    window.BOARD_TYPES.forEach(function (b) {
      const tab = document.createElement("div");
      tab.className = "board-type-tab" + (b.key === currentAdminBoard ? " active" : "");
      tab.textContent = window.I18N[lang][b.i18nKey];
      tab.addEventListener("click", function () {
        currentAdminBoard = b.key;
        renderAdminBoardTypeTabs();
        renderAdminBoardList();
      });
      el.appendChild(tab);
    });
  }

  function renderAdminBoardList() {
    const wrap = document.getElementById("adminBoardListWrap");
    wrap.innerHTML = "";
    const posts = adminAllPosts.filter(function (p) { return p.board === currentAdminBoard; });
    if (posts.length === 0) {
      const empty = document.createElement("div");
      empty.className = "board-empty";
      empty.textContent = window.I18N[lang].boardEmpty;
      wrap.appendChild(empty);
      return;
    }
    posts.forEach(function (post) {
      const card = document.createElement("div");
      card.className = "board-post-card";

      const title = document.createElement("div");
      title.className = "post-card-title";
      title.textContent = post.title || "";
      card.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "post-card-meta";
      meta.textContent = window.formatAuthor(post, lang) + " · " + window.formatPostDate(post.createdAt);
      card.appendChild(meta);

      const content = document.createElement("div");
      content.className = "board-post-content";
      content.textContent = post.content || "";
      content.style.margin = "6px 0";
      card.appendChild(content);

      if (post.imageData) {
        const img = document.createElement("img");
        img.className = "post-thumb";
        img.src = post.imageData;
        card.appendChild(img);
      }

      if (post.board === "cs") {
        const replyWrap = document.createElement("div");
        replyWrap.style.marginTop = "8px";
        const replyLabel = document.createElement("label");
        replyLabel.textContent = window.I18N[lang].adminReplyTitle;
        const replyArea = document.createElement("textarea");
        replyArea.className = "field-textarea";
        replyArea.placeholder = window.I18N[lang].adminReplyPlaceholder;
        replyArea.value = (post.adminReply && post.adminReply.content) || "";
        const saveReplyBtn = document.createElement("button");
        saveReplyBtn.className = "btn small";
        saveReplyBtn.textContent = window.I18N[lang].saveReplyBtn;
        saveReplyBtn.addEventListener("click", async function () {
          await updateDoc(doc(db, "posts", post.id), {
            adminReply: { content: replyArea.value.trim(), createdAt: serverTimestamp() }
          });
        });
        replyWrap.appendChild(replyLabel);
        replyWrap.appendChild(replyArea);
        replyWrap.appendChild(saveReplyBtn);
        card.appendChild(replyWrap);
      }

      const removeBtn = document.createElement("button");
      removeBtn.className = "link-btn";
      removeBtn.textContent = window.I18N[lang].deletePostBtn;
      removeBtn.addEventListener("click", async function () {
        if (!confirm(window.I18N[lang].deletePostBtn + "?")) return;
        await deleteDoc(doc(db, "posts", post.id));
        try {
          const commentsSnap = await getDocs(collection(db, "posts", post.id, "comments"));
          for (const c of commentsSnap.docs) await deleteDoc(c.ref);
        } catch (e) {}
      });
      card.appendChild(removeBtn);

      wrap.appendChild(card);
    });
  }

  onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), function (snap) {
    adminAllPosts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    renderAdminBoardList();
  });

  // ---------- 예약 관리 ----------
  let adminAllReservations = [];

  function renderAdminReservationList() {
    const wrap = document.getElementById("adminReservationListWrap");
    wrap.innerHTML = "";
    if (adminAllReservations.length === 0) {
      const empty = document.createElement("div");
      empty.className = "board-empty";
      empty.textContent = window.I18N[lang].reservationEmpty;
      wrap.appendChild(empty);
      return;
    }
    const sorted = adminAllReservations.slice().sort(function (a, b) {
      return (a.date || "").localeCompare(b.date || "") ||
        (a.direction || "").localeCompare(b.direction || "") ||
        (a.time || "").localeCompare(b.time || "");
    });
    sorted.forEach(function (r) {
      const card = document.createElement("div");
      card.className = "board-post-card";

      const dirLabel = (window.DIRECTIONS.find(function (d) { return d.key === r.direction; }) || {}).label || r.direction;
      const info = document.createElement("div");
      info.className = "post-card-title";
      info.textContent = r.date + " · " + r.title + " " + r.time + " (" + dirLabel + ")";
      card.appendChild(info);

      const fieldsRow = document.createElement("div");
      fieldsRow.style.display = "flex";
      fieldsRow.style.gap = "6px";
      fieldsRow.style.margin = "6px 0";

      const nameInput = document.createElement("input");
      nameInput.className = "field-text";
      nameInput.placeholder = window.I18N[lang].postNamePlaceholder;
      nameInput.value = r.name || "";
      const countryInput = document.createElement("input");
      countryInput.className = "field-text";
      countryInput.placeholder = window.I18N[lang].postCountryPlaceholder;
      countryInput.value = r.country || "";
      const headcountInput = document.createElement("input");
      headcountInput.type = "number";
      headcountInput.min = "1";
      headcountInput.className = "field-text";
      headcountInput.style.flex = "0 0 60px";
      headcountInput.value = r.headcount || 1;

      fieldsRow.appendChild(nameInput);
      fieldsRow.appendChild(countryInput);
      fieldsRow.appendChild(headcountInput);
      card.appendChild(fieldsRow);

      const actions = document.createElement("div");
      actions.style.display = "flex";
      actions.style.gap = "10px";
      actions.style.alignItems = "center";

      const saveBtn = document.createElement("button");
      saveBtn.className = "btn small";
      saveBtn.textContent = lang === "ko" ? "저장" : "Save";
      saveBtn.addEventListener("click", async function () {
        await updateDoc(doc(db, "reservations", r.id), {
          name: nameInput.value.trim(),
          country: countryInput.value.trim(),
          headcount: parseInt(headcountInput.value, 10) || 1
        });
      });
      const cancelBtn = document.createElement("button");
      cancelBtn.className = "link-btn";
      cancelBtn.textContent = window.I18N[lang].reserveCancelBtn;
      cancelBtn.addEventListener("click", async function () {
        if (!confirm(window.I18N[lang].reserveCancelConfirm)) return;
        await deleteDoc(doc(db, "reservations", r.id));
      });
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      card.appendChild(actions);

      wrap.appendChild(card);
    });
  }

  onSnapshot(collection(db, "reservations"), function (snap) {
    adminAllReservations = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    renderAdminReservationList();
  });

  // ---------- 샘플 데이터 불러오기 ----------
  document.getElementById("loadSeedBtn").addEventListener("click", async function () {
    if (!confirm(window.I18N[lang].loadSeedConfirm)) return;
    const msg = document.getElementById("seedMsg");
    try {
      await setDoc(doc(db, "schedules", "toRange"), window.SEED_DATA.toRange);
      await setDoc(doc(db, "schedules", "toCity"), window.SEED_DATA.toCity);
      workingData.toRange = JSON.parse(JSON.stringify(window.SEED_DATA.toRange));
      workingData.toCity = JSON.parse(JSON.stringify(window.SEED_DATA.toCity));
      renderRowsEditor();
      msg.textContent = window.I18N[lang].saved;
      msg.className = "save-msg ok";
    } catch (e) {
      msg.textContent = window.I18N[lang].saveFail;
      msg.className = "save-msg err";
    }
  });

  // ---------- 초기화 ----------
  async function init() {
    setLang(lang);
    renderAdminSectionTabs();
    showAdminSection();
    await loadDirection(currentDirection);
    renderDirTabs();
    renderRowsEditor();
    await loadNotice();
    renderAdminBoardTypeTabs();
    renderAdminBoardList();
  }
</script>
</body>
</html>
